name: Vérifications

# Un test qui ne tourne pas tout seul finit par ne plus tourner du tout.
# Chaque poussée passe donc par la même porte : les tests, puis le build.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Le build a besoin de ces deux variables ; des valeurs factices
          # suffisent, on ne contacte rien ici.
          VITE_SUPABASE_URL: https://exemple.supabase.co
          VITE_SUPABASE_ANON_KEY: cle-de-build
